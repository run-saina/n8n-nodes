# Publishes through npm Trusted Publishing (OIDC, no stored token); the npm package trusts this repository and this
# workflow file. A push to main that changes package.json publishes the new version when it is not on npm yet.
name: Publish
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.21.0
      - name: Skip when this version is already on npm
        id: version
        run: |
          if [ -n "$(npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version)" ]; then
            echo "Version already published, nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm ci --ignore-scripts
      - if: steps.version.outputs.publish == 'true'
        run: npm run lint
      - if: steps.version.outputs.publish == 'true'
        run: npm test
      - if: steps.version.outputs.publish == 'true'
        run: npm run scan
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
      - name: Verify published package
        if: steps.version.outputs.publish == 'true'
        timeout-minutes: 25
        run: |
          # npm scans uploads before making them available; this can take 15+ minutes.
          package="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 40); do
            if npm view "$package" version >/dev/null 2>&1; then
              npm run scan:published
              exit 0
            fi
            echo "Waiting for npm to make $package available ($attempt/40)"
            sleep 30
          done
          echo "::error::npm accepted the upload, but $package is still unavailable after 20 minutes. Check npm processing before retrying publication."
          exit 1
