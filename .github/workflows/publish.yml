name: Publish
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Stage a release, or verify it after approval on npm
        type: choice
        options: [stage, verify]
        default: stage
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.21.0
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run scan
      - name: Stage release for npm approval
        if: inputs.operation == 'stage'
        run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify approved release
        if: inputs.operation == 'verify'
        run: npm run scan:published
